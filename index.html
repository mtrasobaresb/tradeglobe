<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Trade Visualizer</title>
  </head>
  <body>
    <!-- The WebGL Canvas mounts directly inside this wrapper -->
    <div id="globeViz"></div>

    <!-- The Floating Metadata Context Sidebar -->
    <div id="sidebar">
      <h2 style="margin-top: 0; font-weight: 600;">Global Trade Explorer</h2>
      <p style="font-size: 0.9rem; color: #9ca3af;">Select a country or filter product sections to begin tracking macroscopic trade velocity.</p>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
      <!-- Dynamic selector drop-downs will inject here later -->
      <div id="ui-controls"></div>
    </div>

    <!-- The Horizontal Time Navigation Component -->
    <div id="timeline-container">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="active-year-display" style="font-weight: bold; font-size: 1.2rem;">Year: 2018</span>
        <button id="play-button" style="background: #c084fc; border: none; padding: 5px 15px; border-radius: 6px; cursor: pointer; color: #000; font-weight: bold;">Play</button>
      </div>
      <!-- D3 Timeline graph will sit here -->
      <div id="timeline-chart" style="width: 100%; height: 40px; margin-top: 10px;"></div>
    </div>

    <!-- Vite explicitly points straight to main.ts script entry -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
