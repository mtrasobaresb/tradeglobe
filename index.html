<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Trade Visualizer</title>
  </head>
  <body>
    <!-- The WebGL Canvas mounts directly inside this wrapper -->
    <div id="globe-container"></div>

    <!-- The Floating Metadata Context Sidebar -->
    <div id="sidebar">
      <h2 style="margin-top: 0; font-weight: 600; font-size: 1.25rem;">Global Trade Explorer</h2>
      <p style="font-size: 0.85rem; color: #9ca3af; line-height: 1.4;">Select a country or filter product sections to begin tracking macroscopic trade velocity.</p>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
      <!-- Dynamic selector drop-downs will inject here later -->
      <div id="ui-controls"></div>
    </div>

    <!-- The Horizontal Time Navigation Component -->
    <div id="timeline-container" class="timeline-bar">
      <button id="play-pause-btn" class="play-btn" aria-label="Toggle Playback">
        <svg id="play-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" width="16" height="16" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <div class="slider-wrapper">
        <input type="range" id="year-slider" min="1995" max="2024" step="1" value="2024" />
        <div id="slider-ticks" class="slider-ticks"></div>
      </div>
    </div>

    <!-- Vite explicitly points straight to main.ts script entry -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
